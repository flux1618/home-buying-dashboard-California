name: Refresh weekly mortgage rate

on:
  schedule:
    # GitHub Actions cron is UTC. 18:00 UTC is 14:00 ET during daylight saving time and
    # 13:00 ET in standard time: safely after Freddie Mac's Thursday ~10:00 ET PMMS release
    # in either case. A fixed UTC cron cannot stay at one ET wall-clock hour across DST.
    - cron: "0 18 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED MORTGAGE30US snapshot
        run: python tools/build_rates_snapshot.py

      - name: Validate generated snapshot
        run: python tools/build_rates_snapshot.py --check

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/mortgage30us.json; then
            echo "Mortgage snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mortgage30us.json
          git commit -m "chore(data): refresh MORTGAGE30US"
          git push
