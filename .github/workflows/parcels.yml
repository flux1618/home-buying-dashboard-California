name: Refresh bounded parcel snapshot

on:
  # 05:20 UTC is 01:20 during EDT and 00:20 during EST. GitHub cron is UTC-only;
  # either time is overnight Eastern and avoids competing with normal daytime use.
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the optional parquet writer
        run: python -m pip install -e '.[parcels]'

      - name: Refresh from LA County Assessor GIS
        run: |
          # A government GIS outage is a data degradation, not a failed application build.
          # The builder preserves the previous complete artifact and returns nonzero honestly.
          if ! python tools/build_parcels_snapshot.py; then
            echo "County parcel refresh degraded; leaving the prior snapshot untouched."
          fi

      - name: Check the committed artifact without contacting the county
        run: |
          # A stale artifact is visible in logs but does not turn an upstream outage into red CI.
          if ! python tools/build_parcels_snapshot.py --check; then
            echo "Parcel snapshot is missing, incomplete, or stale; see refresh output above."
          fi

      - name: Commit only a changed parcel artifact
        run: |
          if git diff --quiet -- data/parcels.parquet data/parcels.meta.json; then
            echo "No retained parcel data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parcels.parquet data/parcels.meta.json
          git commit -m "data: refresh bounded parcels snapshot"
          git push
